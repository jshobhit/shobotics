<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Svaram · After your session</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a href="/">← Study visits</a><div class="eyebrow">After the session</div><h1>How do you feel now?</h1><p>Rate each feeling separately. You can leave any question unanswered.</p><p id="identity"></p></header>
<form id="survey"><section><h2>Right now</h2><div id="states"></div></section><section><h2>Your experience</h2><div id="experience"></div></section><section><button class="primary" type="submit">Submit answers</button> <button id="save" type="button">Save draft</button><p id="status" role="status" aria-live="polite"></p></section></form>
<script>
const postDefinition=__POST_DEFINITION__;
for(const [id,title] of postDefinition.states){const fs=document.createElement('fieldset');fs.dataset.question='state_'+id;const legend=document.createElement('legend');legend.textContent=title;fs.append(legend);const choices=document.createElement('div');choices.className='scale';for(let n=0;n<=10;n++){const label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='state_'+id;input.value=n;label.append(input,document.createTextNode(String(n)));choices.append(label)}fs.append(choices);const anchors=document.createElement('div');anchors.className='anchors';anchors.innerHTML='<span>0 · Not at all</span><span>10 · Extremely</span>';fs.append(anchors);const clear=document.createElement('button');clear.type='button';clear.className='clear';clear.textContent='Clear answer';clear.addEventListener('click',()=>{fs.querySelectorAll('input').forEach(input=>input.checked=false);fs.dispatchEvent(new Event('input',{bubbles:true}))});fs.append(clear);document.getElementById('states').append(fs)}
for(const [id,title] of postDefinition.experience){const label=document.createElement('label');label.htmlFor=id;label.textContent=title;const input=document.createElement('textarea');input.id=id;input.name=id;input.maxLength=2000;document.getElementById('experience').append(label,input)}
</script><script src="/survey.js"></script></body></html>
